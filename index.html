<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffb6d5, #a7d8ff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.player {
    width: 330px;
    padding: 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(20px);
    box-shadow: 0 15px 45px rgba(0,0,0,0.15);
    text-align: center;
}

.cover {
    height: 260px;
    border-radius: 22px;
    background: linear-gradient(135deg, #ff78b2, #8bc8ff);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.message {
    font-size: 58px;
    font-weight: bold;
    color: white;
    text-shadow: 0 5px 20px #ff4b9a;
    animation: appear 0.7s ease;
    z-index: 2;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

.heart {
    position: absolute;
    bottom: -40px;
    font-size: 28px;
    animation: fly 4s linear forwards;
    pointer-events: none;
}

@keyframes fly {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    to {
        transform: translateY(-350px) rotate(40deg);
        opacity: 0;
    }
}

.song {
    margin-top: 22px;
    color: #fff;
    font-size: 23px;
    font-weight: bold;
}

.artist {
    color: #fff;
    opacity: 0.85;
    margin-top: 7px;
}

.progress {
    height: 5px;
    background: rgba(255,255,255,0.4);
    margin-top: 25px;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: white;
}

.controls {
    color: white;
    font-size: 30px;
    margin-top: 20px;
    letter-spacing: 15px;
}

.username {
    margin-top: 20px;
    color: white;
    font-weight: bold;
    opacity: 0;
    transition: opacity 1s;
}

.username.show {
    opacity: 1;
}
</style>
</head>

<body>

<div class="player">
    <div class="cover" id="cover">
        <div class="message" id="message">Я</div>
    </div>

    <div class="song">Для тебя ❤️</div>
    <div class="artist">Моя любовь</div>

    <div class="progress">
        <div class="progress-fill" id="progress"></div>
    </div>

    <div class="controls">◀ ❚❚ ▶</div>

    <div class="username" id="username">
        @VENOM526967
    </div>
</div>

<script>
const messages = [
    "Я",
    "❤️",
    "ТЫ",
    "💗",
    "МОЁ",
    "СЧАСТЬЕ",
    "💕",
    "Я ТЕБЯ",
    "ЛЮБЛЮ"
];

const message = document.getElementById("message");
const username = document.getElementById("username");
const progress = document.getElementById("progress");
const cover = document.getElementById("cover");

let index = 0;
let startTime = Date.now();

const duration = messages.length * 1600 + 2500;

function changeMessage() {
    message.style.animation = "none";
    void message.offsetWidth;

    message.textContent = messages[index];
    message.style.animation = "appear 0.7s ease";

    if (index === messages.length - 1) {
        username.classList.add("show");
    }

    index++;

    if (index >= messages.length) {
        setTimeout(() => {
            index = 0;
            username.classList.remove("show");
            startTime = Date.now();
        }, 2500);
    } else {
        setTimeout(changeMessage, 1600);
    }

    if (index === 0) {
        setTimeout(changeMessage, 100);
    }
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = ["❤️","💗","💕","💖"][
        Math.floor(Math.random() * 4)
    ];

    heart.style.left = Math.random() * 90 + "%";
    heart.style.animationDuration =
        (3 + Math.random() * 2) + "s";

    cover.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}

function updateProgress() {
    const elapsed = (Date.now() - startTime) % duration;
    progress.style.width = (elapsed / duration * 100) + "%";
    requestAnimationFrame(updateProgress);
}

changeMessage();
updateProgress();
setInterval(createHeart, 350);
</script>

</body>
</html>
